name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python3 -m py_compile backend/server.py recorder/recorder.py generate_go2rtc.py tapo-helper/osd.py
      - name: Check JavaScript syntax
        run: node --input-type=module --check < web/app.js
